name: AgentVibeIsland
options:
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  AgentVibeIsland:
    type: application
    platform: macOS
    sources:
      - path: AgentVibeIsland
        excludes:
          - "*.entitlements"
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: AgentVibeIsland/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentVibeIsland/AgentVibeIsland.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.agentvibeisland.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
  AgentVibeIslandTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentVibeIslandTests
    dependencies:
      - target: AgentVibeIsland
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
